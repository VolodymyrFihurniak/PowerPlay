name: CI-Debug
run-name: CI-Debug

on:
  pull_request:
    branches:
    - integration

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2
    - name: Install dependencies
      working-directory: server
      run: bun install
    - name: Lint
      working-directory: server
      run: bun run lint
